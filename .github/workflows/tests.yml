name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérification syntaxique
        run: |
          node --check engine.js
          node --check ui.js
          node --check test.js
      - name: Tests du moteur « Oiseau, compte ! » (node test.js)
        run: node test.js
      - name: Tests du moteur « Nombre mystère » (node nombre-mystere/test.js)
        run: node nombre-mystere/test.js
